<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1E40C8">
<meta name="description" content="UAN Vital 360°: tu bienestar también hace parte de tu jornada.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>UAN Vital 360°</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* Layout: app de una columna (máx 480px) con navegación inferior fija; tarjetas solo donde hay una acción o un resultado */
:root{
  --bg:#EEF2FB; --surface:#FFFFFF; --sunk:#E2E8F7; --ink:#0F1B45; --muted:#55618A; --line:#D3DBF0;
  --primary:#1E40C8; --primary-ink:#FFFFFF; --primary-soft:rgba(30,64,200,.15); --accent:#F5C400; --accent-ink:#1A1500;
  --c-mental:#7B4FD6; --c-fisico:#E0702F; --c-habitos:#2E9A63; --c-descanso:#1E40C8; --c-agua:#17A2B6;
  --ok:#2E9A63; --mid:#2F6FE0; --low:#C99A00;
  --ok-bg:#E1F3E9; --mid-bg:#E3ECFD; --low-bg:#FDF4D2;
  --f-display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:18px; --shadow:0 1px 2px rgba(18,48,46,.06), 0 6px 20px rgba(18,48,46,.06);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0A1030; --surface:#121A42; --sunk:#1A2452; --ink:#E8ECFA; --muted:#9AA6D0; --line:#26315F;
  --primary:#6E8BFF; --primary-ink:#0A1030; --primary-soft:rgba(110,139,255,.22); --accent:#FFD23F; --accent-ink:#1A1500;
  --c-mental:#A98BF0; --c-fisico:#F2955C; --c-habitos:#5CC98E; --c-descanso:#6E8BFF; --c-agua:#4DCFE0;
  --ok:#5CC98E; --mid:#7FA6F5; --low:#FFD23F;
  --ok-bg:#163327; --mid-bg:#18264F; --low-bg:#3A3015;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0A1030; --surface:#121A42; --sunk:#1A2452; --ink:#E8ECFA; --muted:#9AA6D0; --line:#26315F;
  --primary:#6E8BFF; --primary-ink:#0A1030; --primary-soft:rgba(110,139,255,.22); --accent:#FFD23F; --accent-ink:#1A1500;
  --c-mental:#A98BF0; --c-fisico:#F2955C; --c-habitos:#5CC98E; --c-descanso:#6E8BFF; --c-agua:#4DCFE0;
  --ok:#5CC98E; --mid:#7FA6F5; --low:#FFD23F;
  --ok-bg:#163327; --mid-bg:#18264F; --low-bg:#3A3015;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark }

html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.9rem;font-weight:800} h2{font-size:1.4rem;font-weight:800} h3{font-size:1.08rem;font-weight:600}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.app{max-width:480px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));padding-block:20px 110px;display:flex;flex-direction:column;gap:20px}
.app.flow{padding-bottom:40px}
.muted{color:var(--muted)}
.eyebrow{font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--primary)}
.splash h1 small::after{content:"";display:block;width:48px;height:4px;border-radius:4px;background:var(--accent);margin:12px auto 0}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:14px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 22px;border-radius:999px;background:var(--primary);color:var(--primary-ink);font-weight:700;font-size:1rem;width:100%;transition:transform .15s}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.big{min-height:60px;font-size:1.08rem}
.btn.ghost{background:var(--sunk);color:var(--ink)}
.btn.small{min-height:40px;width:auto;padding:0 16px;font-size:.92rem}
.link{color:var(--primary);font-weight:700;padding:6px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:8px 16px;border-radius:14px;background:var(--surface);border:1.5px solid var(--line);font-weight:600;font-size:.95rem;text-align:left}
.chip[aria-pressed="true"]{background:var(--primary-soft);border-color:var(--primary);color:var(--ink)}
.chip.sm{min-height:36px;padding:6px 12px;font-size:.85rem;border-radius:999px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opts .chip{text-align:center;font-size:.9rem;padding:8px 6px}
.q{display:flex;flex-direction:column;gap:10px;padding-block:6px}
.q + .q{border-top:1px solid var(--line);padding-top:16px}
.q-title{font-weight:600}
.field{display:flex;flex-direction:column;gap:10px}
.field label,.field .lbl{font-weight:700}
input[type=text]{min-height:48px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:0 14px;font:inherit}
.consent{display:grid;grid-template-columns:26px 1fr;gap:12px;align-items:start;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px;font-size:.9rem;line-height:1.45}
.consent[aria-pressed="true"]{border-color:var(--primary)}
.consent .box{width:24px;height:24px;border-radius:7px;border:2px solid var(--primary);display:grid;place-items:center;font-weight:800;color:var(--primary-ink)}
.consent[aria-pressed="true"] .box{background:var(--primary)}
.err{color:var(--low);font-weight:600;font-size:.92rem;background:var(--low-bg);padding:10px 14px;border-radius:12px}
.progress{height:10px;border-radius:999px;background:var(--sunk);overflow:hidden}
.progress > i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .4s}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.steps span{height:6px;border-radius:999px;background:var(--sunk)}
.steps span.on{background:var(--primary)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:800;font-size:1rem}
.brand svg{width:30px;height:30px}

/* Splash */
.splash{min-height:calc(100dvh - 60px);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:26px;text-align:center;position:relative}
.splash .art{position:relative;width:230px;height:230px;max-width:100%}
.splash .art svg.logo{width:100%;height:100%}
.float{position:absolute;width:42px;height:42px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center}
.float svg{width:22px;height:22px;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.f1{top:4px;left:0}.f2{top:20px;right:-6px}.f3{bottom:18px;left:-8px}.f4{bottom:0;right:6px}
@media (prefers-reduced-motion:no-preference){.float{animation:bob 5s ease-in-out infinite}.f2{animation-delay:-1.2s}.f3{animation-delay:-2.4s}.f4{animation-delay:-3.6s}}
@keyframes bob{50%{transform:translateY(-6px)}}
.splash h1{font-size:2.3rem}
.splash h1 small{display:block;font-size:.95rem;font-weight:600;color:var(--muted);letter-spacing:.14em;margin-top:6px}
.tagline{font-size:1.15rem;max-width:22ch;color:var(--ink)}

/* Results */
.chart-box{position:relative;height:270px}
.chart-box.tall{height:300px}
.chart-box.short{height:230px}
.score-list{display:flex;flex-direction:column}
.score{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.score:first-child{border-top:0}
.score .ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:1.2rem;background:var(--sunk)}
.score .name{font-weight:700}
.score .pct{font-family:var(--f-display);font-weight:800;font-size:1.4rem;font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:700;padding:3px 10px;border-radius:999px;margin-top:2px}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.mid{background:var(--mid-bg);color:var(--mid)} .pill.low{background:var(--low-bg);color:var(--low)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.85rem;color:var(--muted)}

/* Rec + challenge */
.rec{background:var(--primary);color:var(--primary-ink);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:12px}
.rec .eyebrow{color:inherit;opacity:.8}
.rec .btn{background:var(--accent);color:var(--accent-ink)}
.btn.big{box-shadow:inset 0 -3px 0 var(--accent)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.75rem;font-weight:600;color:var(--muted)}
.day b{width:100%;aspect-ratio:1;max-width:44px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-size:.95rem}
.day.done b{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.day.today b{border-color:var(--primary);border-width:2.5px}
.day[disabled]{opacity:.4;cursor:default}
.tips{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.tips li{display:grid;grid-template-columns:28px 1fr;gap:8px;background:var(--sunk);padding:12px;border-radius:14px}
.tips li span{font-weight:800;color:var(--primary);font-family:var(--f-display)}
.trend{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.trend:first-child{border-top:0}
.trend .arrow{font-family:var(--f-display);font-weight:800;font-size:1.3rem;width:34px;height:34px;border-radius:10px;display:grid;place-items:center}
.arrow.up{background:var(--ok-bg);color:var(--ok)} .arrow.eq{background:var(--mid-bg);color:var(--mid)} .arrow.down{background:var(--low-bg);color:var(--low)}
.trend .vals{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem;text-align:right}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;color:var(--muted)}
.empty strong{color:var(--ink)}
.kv{display:grid;grid-template-columns:1fr auto;gap:8px 12px;font-size:.95rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:700;text-align:right}
.notice{background:var(--ok-bg);color:var(--ink);border-radius:14px;padding:14px;display:flex;gap:10px;align-items:flex-start}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:999px;font-weight:700;font-size:.92rem;z-index:30;max-width:calc(100% - 32px);text-align:center}

/* Nav */
nav.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.bar .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.bar button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 2px 10px;font-size:.72rem;font-weight:600;color:var(--muted);position:relative}
nav.bar button .e{font-size:1.25rem;line-height:1.2;filter:grayscale(.7);opacity:.75}
nav.bar button[aria-current="page"]{color:var(--primary)}
nav.bar button[aria-current="page"] .e{filter:none;opacity:1}
nav.bar button[aria-current="page"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
nav.bar .dot{position:absolute;top:7px;right:calc(50% - 18px);width:8px;height:8px;border-radius:50%;background:var(--low)}
</style>

</head>
<body>
<div id="view" class="app"></div>
<nav class="bar" id="nav" hidden aria-label="Navegación principal"><div class="in">
  <button data-act="tab" data-v="inicio"><span class="e">🏠</span>Inicio</button>
  <button data-act="tab" data-v="evaluacion"><span class="e">📋</span>Evaluación</button>
  <button data-act="tab" data-v="evolucion"><span class="e">📈</span>Mi evolución</button>
  <button data-act="tab" data-v="retos"><span class="e">🎯</span>Mis retos</button>
  <button data-act="tab" data-v="perfil"><span class="e">👤</span>Perfil</button>
</div></nav>

<script>
/* ---------- Datos y almacenamiento (solo en este dispositivo) ---------- */
const KEY='uan-vital-360-v1';
/* Pega aquí la URL de tu aplicación web de Google Apps Script (termina en /exec) */
const SHEETS_URL='https://script.google.com/macros/s/AKfycbzj4awZ8Ri7G8XM9QwsDX-yDpcv3LSy4ZDM1VEmePHzkgqRcw6xPY1E81OuwRCy7ykW/exec';
const sheetsOn=()=>/^https:\/\/script\.google\.com\/.+\/exec/.test(SHEETS_URL);
const blank=()=>({profile:null,assessments:[],checkins:[],challenge:null,uid:null,consent:null,queue:[],lastSync:null});
let S=load();
function load(){try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);return Object.assign(blank(),o);}}catch(e){}return blank();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c);};
const today=()=>ymd(new Date());
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d);};
const diff=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const fmt=(s,o)=>parse(s).toLocaleDateString('es-CO',o||{day:'numeric',month:'short'});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const AREAS=[
 {k:'mental',e:'🧠',n:'Bienestar mental',s:'Mental',c:'--c-mental'},
 {k:'fisico',e:'🏃',n:'Bienestar físico',s:'Físico',c:'--c-fisico'},
 {k:'habitos',e:'🥗',n:'Hábitos saludables',s:'Hábitos saludables',c:'--c-habitos'},
 {k:'descanso',e:'😴',n:'Descanso',s:'Descanso',c:'--c-descanso'}];

const PROFILE=[
 {k:'edad',l:'Edad',o:['18 a 25','26 a 35','36 a 45','46 a 55','56 o más']},
 {k:'area',l:'Área de trabajo',o:['Docencia','Administrativa','Investigación','Bienestar / Salud','Tecnología','Servicios generales','Estudiante','Otra']},
 {k:'horario',l:'Horario laboral',o:['Diurno','Mixto','Nocturno','Por turnos','Flexible / remoto']},
 {k:'sueno',l:'Horas de sueño',o:['Menos de 5','5 a 6','7 a 8','Más de 8']},
 {k:'actividad',l:'Actividad física',o:['Ninguna','1 a 2 días por semana','3 a 4 días por semana','5 días o más']},
 {k:'alimentacion',l:'Alimentación',o:['Balanceada','Regular','Poco saludable']},
 {k:'hidratacion',l:'Hidratación al día',o:['Menos de 1 litro','1 a 2 litros','Más de 2 litros']},
 {k:'estres',l:'Manejo del estrés',o:['Lo manejo bien','A veces me cuesta','Me cuesta bastante']}];

const VQ={
 mental:['Me siento con energía y buen ánimo durante mi jornada.','Manejo la presión del trabajo con calma.','Dedico tiempo a actividades que disfruto.'],
 fisico:['Realizo al menos 30 minutos de actividad física.','Hago pausas activas durante la jornada.','Me siento con buena condición física para mis tareas.'],
 habitos:['Consumo frutas y verduras a diario.','Tomo suficiente agua durante el día.','Mantengo horarios regulares de comida.'],
 descanso:['Duermo entre 7 y 8 horas.','Me despierto sintiéndome descansado(a).','Me desconecto del trabajo antes de dormir.']};
const QL={
 mental:['Energía y buen ánimo','Maneja la presión con calma','Tiempo para actividades que disfruta'],
 fisico:['30 min de actividad física','Pausas activas en la jornada','Buena condición física'],
 habitos:['Frutas y verduras a diario','Suficiente agua','Horarios regulares de comida'],
 descanso:['Duerme 7 a 8 horas','Despierta descansado(a)','Se desconecta antes de dormir']};
const FREQ=['Siempre','Frecuentemente','Algunas veces','Nunca'];
const PTS=[100,75,50,25];

const CI=[
 {k:'descanso',e:'😴',q:'¿Cómo estuvo tu descanso?',o:['Muy bien','Bien','Regular','Mal'],n:'Sueño',c:'--c-descanso'},
 {k:'actividad',e:'🏃',q:'¿Tuviste actividad física?',o:['Sí, varios días','Sí, un día','Muy poca','No'],n:'Actividad física',c:'--c-fisico'},
 {k:'alimentacion',e:'🥗',q:'¿Cómo fue tu alimentación?',o:['Muy saludable','Saludable','Regular','Poco saludable'],n:'Alimentación',c:'--c-habitos'},
 {k:'agua',e:'💧',q:'¿Tomaste suficiente agua?',o:['Sí, suficiente','Casi suficiente','Poca','Muy poca'],n:'Hidratación',c:'--c-agua'},
 {k:'estres',e:'🧠',q:'¿Cómo manejaste el estrés?',o:['Muy bien','Bien','Me costó un poco','Me costó mucho'],n:'Manejo del estrés',c:'--c-mental'},
 {k:'pausa',e:'🌿',q:'¿Tuviste momentos de pausa durante tu jornada?',o:['Sí, varios','Sí, alguno','Casi ninguno','No'],n:'Pausas',c:'--primary'}];

const REC={
 descanso:{t:'😴 Cuida tu descanso',p:'Intenta mantener horarios regulares de sueño y crear un espacio tranquilo para descansar.',
  tips:['Acuéstate y levántate a la misma hora, también el fin de semana.','Deja las pantallas 30 minutos antes de dormir.','Mantén la habitación oscura, fresca y en silencio.','Evita café y bebidas energéticas después de las 3 p. m.']},
 mental:{t:'🧠 Cuida tu mente',p:'Pequeñas pausas para respirar y ordenar el día ayudan a bajar la presión de la jornada.',
  tips:['Respira 4 segundos, sostén 4 y suelta en 6. Repite 5 veces.','Divide las tareas grandes en pasos cortos y marca cada avance.','Habla con alguien de confianza cuando sientas carga acumulada.','Acércate al área de bienestar de tu institución si lo necesitas.']},
 fisico:{t:'🏃 Muévete más',p:'Moverte unos minutos varias veces al día suma tanto como una sesión larga de ejercicio.',
  tips:['Haz una pausa activa de 5 minutos cada 2 horas.','Usa las escaleras en lugar del ascensor.','Camina 20 minutos al día, puede ser en dos partes.','Estira cuello, hombros y espalda al terminar la jornada.']},
 habitos:{t:'🥗 Nutre tu jornada',p:'Comer a horas regulares y tener agua a la mano facilita mantener la energía todo el día.',
  tips:['Ten una botella de agua visible en tu puesto.','Incluye una fruta a media mañana y otra a media tarde.','Respeta tu hora de almuerzo lejos del computador.','Agrega una porción de verduras a cada comida principal.']}};

const CHAL={
 fisico:['🏃 Realiza una pausa activa durante tu jornada.','🚶 Camina 20 minutos durante el día.'],
 mental:['🧠 Dedica 5 minutos a respirar con calma.','📝 Escribe una cosa buena de tu día.'],
 habitos:['💧 Toma 8 vasos de agua durante el día.','🍎 Come una fruta a media mañana.'],
 descanso:['😴 Acuéstate a la misma hora cada noche.','📵 Deja el celular 30 minutos antes de dormir.']};

/* ---------- Cálculos ---------- */
const avg=a=>a.reduce((s,x)=>s+x,0)/a.length;
const lastA=()=>S.assessments[S.assessments.length-1]||null;
const lastC=()=>S.checkins[S.checkins.length-1]||null;
const monthCI=()=>{const since=addDays(today(),-30);return S.checkins.filter(c=>c.date>=since);};
function monthScores(){
  const a=lastA(); if(!a) return null;
  const cs=monthCI().filter(c=>c.date>=addDays(a.date,-1)); if(!cs.length) return {...a.scores};
  const m=k=>avg(cs.map(c=>c.v[k]));
  const ci={mental:(m('estres')+m('pausa'))/2,fisico:m('actividad'),habitos:(m('alimentacion')+m('agua'))/2,descanso:m('descanso')};
  const o={};AREAS.forEach(({k})=>o[k]=Math.round(a.scores[k]*.5+ci[k]*.5));return o;
}

const nowStr=()=>{const d=new Date();return ymd(d)+' '+pad(d.getHours())+':'+pad(d.getMinutes());};

 const p=S.profile||{},a=lastA(),m=monthScores(),r={};

 PROFILE.forEach(x=>r[x.l]=p[x.k]||'');

 AREAS.forEach(ar=>r[`Puntaje ${ar.s.toLowerCase()} (%)`]=a?a.scores[ar.k]:'');
 r['Puntaje general (%)']=a?Math.round(avg(AREAS.map(x=>a.scores[x.k]))):'';

 return r;}
function ciRow(c){
 const r={'ID registro':S.uid+'-'+c.date,'ID usuario':S.uid,'Fecha':c.date,'Hora de envío':nowStr(),'Área de trabajo':(S.profile||{}).area||''};
 CI.forEach(q=>{const j=PTS.indexOf(c.v[q.k]);r[q.n+' (respuesta)']=j>-1?q.o[j]:'';r[q.n+' (%)']=c.v[q.k];});
 r['Promedio check-in (%)']=Math.round(avg(CI.map(q=>c.v[q.k])));return r;}
function sync(ci){
 if(!S.uid)return;
 S.queue=(S.queue||[]).filter(it=>it.checkin);
 const it={user:userRow()}; if(ci)it.checkin=ciRow(ci);
 S.queue.push(it); save(); flush();}
let flushing=false;
async function flush(){
 if(flushing||!S.queue||!S.queue.length||!sheetsOn())return; flushing=true;
 try{while(S.queue.length){await fetch(SHEETS_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(S.queue[0])});S.queue.shift();S.lastSync=nowStr();save();}}catch(e){}
 flushing=false; if(!flow&&tab==='perfil')render();}
window.addEventListener('online',flush);

   scales:{y:{min:0,max:100,ticks:{stepSize:25,callback:v=>v+'%'},grid:{color:line}},x:{grid:{display:false}}}}}));}
  if(t==='bar'){const cs=monthCI();const qs=CI.slice(0,5);
   charts.push(new Chart(cv,{type:'bar',data:{labels:qs.map(q=>q.n),datasets:[{data:qs.map(q=>Math.round(avg(cs.map(c=>c.v[q.k])))),backgroundColor:qs.map(q=>css(q.c)),borderRadius:8,barThickness:22}]},
   options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>c.raw+'%'}}},scales:{x:{min:0,max:100,ticks:{stepSize:25,callback:v=>v+'%'},grid:{color:line}},y:{grid:{display:false},ticks:{color:ink}}}}}));}
 });}

/* ---------- Render ---------- */
function render(top){
 charts.forEach(c=>c.destroy());charts=[];
 const v=$('#view');v.classList.toggle('flow',!!flow);$('#nav').hidden=!!flow;
 v.innerHTML=flow?FLOW[flow]():TABS[tab]();
 document.querySelectorAll('nav.bar button').forEach(b=>{b.setAttribute('aria-current',b.dataset.v===tab?'page':'false');b.querySelector('.dot')?.remove();if(b.dataset.v==='evaluacion'&&ciDue()&&lastA())b.insertAdjacentHTML('beforeend','<span class="dot" aria-label="Check-in pendiente"></span>');});
 drawCharts();
 if(top)window.scrollTo(0,0);
}
function toast(m){const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2400);}

document.addEventListener('input',e=>{if(e.target.id==='nombre')pDraft.nombre=e.target.value.trim();});
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const a=b.dataset.act,g=b.dataset.g,val=b.dataset.v;
 switch(a){
  case 'start': if(!S.profile){pDraft={};afterProfile='valoracion';flow='perfil';} else if(!lastA()){vStep=0;vDraft={};afterProfile='valoracion';flow='valoracion';} else {flow=null;tab='inicio';} render(true);break;
  case 'splash': flow='splash';render(true);break;
  case 'pick': pDraft[g]=val;pErr='';render();break;
  case 'consent': pDraft.consent=!pDraft.consent;pErr='';render();break;
  case 'pnext': {const miss=PROFILE.filter(p=>!pDraft[p.k]).map(p=>p.l.toLowerCase());if(!S.consent&&!pDraft.consent)miss.unshift('la autorización de datos');if(miss.length){pErr='Falta: '+miss.join(', ')+'.';render();return;}
   if(!S.consent)S.consent=nowStr();if(!S.uid)S.uid='UAN-'+Date.now().toString(36).toUpperCase().slice(-4)+Math.random().toString(36).slice(2,6).toUpperCase();
   const pd={...pDraft};delete pd.consent;S.profile=pd;save();sync();if(afterProfile==='valoracion'){vStep=0;vDraft={};flow='valoracion';}else{flow=null;tab='perfil';toast('Perfil actualizado');}render(true);break;}
  case 'ans': vDraft[g]=+val;render();break;
  case 'vprev': vStep--;render(true);break;
  case 'vnext': if(vStep<3){vStep++;render(true);}else{const sc={};AREAS.forEach(x=>sc[x.k]=Math.round(avg([0,1,2].map(i=>PTS[vDraft[x.k+i]]))));
   const t=today();S.assessments=S.assessments.filter(x=>x.date!==t);S.assessments.push({date:t,scores:sc,answers:{...vDraft}});save();sync();flow='resultado';render(true);}break;
  case 'vredo': vStep=0;vDraft={};afterProfile=S.profile?'repeat':'valoracion';if(!S.profile){pDraft={};flow='perfil';}else flow='valoracion';render(true);break;
  case 'home': flow=null;tab='inicio';render(true);break;
  case 'tab': flow=null;tab=val;if(val!=='retos')recArea=null;confirmReset=false;render(true);break;
  case 'ci': ciDraft[g]=+val;render();break;
  case 'ciagain': ciAgain=true;ciDraft={};render();break;
  case 'cisave': {const v={};CI.forEach(q=>v[q.k]=PTS[ciDraft[q.k]]);const t=today();S.checkins=S.checkins.filter(c=>c.date!==t);S.checkins.push({date:t,v});S.checkins.sort((x,y)=>x.date<y.date?-1:1);save();sync(lastC());ciDraft={};ciAgain=false;toast('Registrado. Tu próximo check-in es en 2 días.');render(true);break;}
  case 'rec': flow=null;tab='retos';recArea=val;render();setTimeout(()=>$('#recs')?.scrollIntoView({behavior:'smooth'}),60);break;
  case 'recarea': recArea=val;render();break;
  case 'day': {const d=S.challenge.done,i=d.indexOf(val);if(i>-1)d.splice(i,1);else{d.push(val);if(d.length===7)toast('¡Reto cumplido! 🎉');}save();sync();render();break;}
  case 'chchange': {const ks=AREAS.map(x=>x.k);const ch=S.challenge;if(ch.idx<1)ch.idx++;else{ch.idx=0;ch.area=ks[(ks.indexOf(ch.area)+1)%4];}ch.done=[];save();sync();render();break;}
  case 'metric': metric=val;render();break;
  case 'pedit': pDraft={...S.profile};pErr='';afterProfile='edit';flow='perfil';render(true);break;
  case 'reset': confirmReset=true;render();break;
  case 'rcancel': confirmReset=false;render();break;
  case 'rconfirm': S=blank();save();try{localStorage.removeItem(KEY);}catch(x){}confirmReset=false;flow='splash';tab='inicio';render(true);break;
 }
});
// Volver a dibujar si cambia el tema
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>render());}catch(e){}
new MutationObserver(()=>render()).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
render();flush();
</script>
